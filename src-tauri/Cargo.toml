[package]
name = "nudge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nudge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nudge-proto = { path = "../crates/nudge-proto" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tiny_http = "0.12"
getrandom = "0.2"
# L4 (D3 opt-in poller): small blocking HTTP client on the OS TLS stack.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

# L4 (D7 click-to-focus)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
