# The landing page lives at https://trynudge.lol (Vercel). GitHub
# Pages now only redirects the old https://vin124.github.io/nudge/ links there,
# keeping the path, so old shares still land and are counted in one place.
name: pages

on:
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write redirect page
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>Nudge has moved</title>
          <link rel="canonical" href="https://trynudge.lol/">
          <meta http-equiv="refresh" content="0; url=https://trynudge.lol/">
          <script>location.replace("https://trynudge.lol" + location.pathname.replace(/^\/nudge/, "") + location.search + location.hash);</script>
          </head><body><p>Nudge moved to <a href="https://trynudge.lol/">trynudge.lol</a>.</p></body></html>
          HTML
          cp out/index.html out/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
