[workspace]
resolver = "2"
members = ["crates/nudge-proto", "crates/nudge-hook", "crates/nudge-status", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
